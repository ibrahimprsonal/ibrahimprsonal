<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    
    <style>
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #a3a3a3; }
      .roles { font-family: "Fira Code", monospace; font-size: 15px; fill: #38bdf8; font-weight: 600; }
      
      @keyframes float1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(40px, -30px) scale(1.1); }
        66% { transform: translate(-20px, 40px) scale(0.9); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(-40px, 30px) scale(1.15); }
        66% { transform: translate(30px, -20px) scale(0.85); }
      }
      @keyframes float3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, 20px) scale(1.05); }
      }
      
      .blob1 { animation: float1 15s ease-in-out infinite; }
      .blob2 { animation: float2 18s ease-in-out infinite; }
      .blob3 { animation: float3 20s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="2" y="2" width="846" height="246" rx="16" ry="16" fill="url(#bg)" stroke="#27272a" stroke-width="2" />

  <clipPath id="windowClip">
    <rect x="2" y="2" width="846" height="246" rx="16" ry="16" />
  </clipPath>

  <g clip-path="url(#windowClip)">
    <g filter="url(#blur)">
      <circle cx="200" cy="50" r="180" fill="url(#blob1)" class="blob1" />
      <circle cx="650" cy="200" r="200" fill="url(#blob2)" class="blob2" />
      <circle cx="425" cy="125" r="180" fill="url(#blob3)" class="blob3" />
    </g>
    <rect x="2" y="2" width="846" height="246" fill="#000000" fill-opacity="0.3" />
  </g>

  <g transform="translate(25, 25)">
    <circle cx="0" cy="0" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="20" cy="0" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="40" cy="0" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
  </g>

  <text x="425" y="105" text-anchor="middle" class="name">Hi, I'm Ibrahim Sheikh 👋</text>
  <text x="425" y="145" text-anchor="middle" class="title">Bridging the gap between Clean Code and Stunning Visuals</text>
  <text x="425" y="195" text-anchor="middle" class="roles">&gt; Software Developer • Creative Designer • Video Editor &lt;</text>
</svg>
